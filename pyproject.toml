[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "tkd-poomsae"
version = "0.1.0"
description = "Local foundation for observing Taekwondo poomsae motion"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
  "av>=16.1,<17",
  "fastapi>=0.115,<1",
  "numpy>=2.2,<3",
  "opencv-contrib-python-headless>=4.11,<5",
  "pydantic>=2.11,<3",
  "uvicorn>=0.34,<1",
]

[project.scripts]
tkd-poomsae = "tkd_poomsae.cli:main"

[dependency-groups]
dev = [
  "httpx>=0.27,<1",
  "imageio-ffmpeg>=0.6,<1",
  "jsonschema>=4.23,<5",
  "mypy>=1.15,<2",
  "pytest>=8.3,<9",
  "ruff>=0.11,<1",
  "types-jsonschema>=4.23,<5",
]

[tool.hatch.build.targets.wheel]
packages = ["src/tkd_poomsae", "contracts", "storage", "datasets", "pipeline", "media", "sync", "calibration"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
files = ["src", "tests", "contracts", "storage", "pipeline", "media", "sync", "calibration"]
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = '-m "not local_data and not full_data and not model_required"'
markers = [
  "synthetic: generated or in-memory unit inputs",
  "local_data: requires registered local dataset; never fetches",
  "full_data: processes every registered form; requires local data",
  "model_required: requires provisioned model assets/runtime",
]
