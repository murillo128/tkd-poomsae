plugins {
    id 'com.android.application'
}

android {
    namespace 'dev.murillo.tkd.multicam'
    compileSdk 35

    defaultConfig {
        applicationId 'dev.murillo.tkd.multicam.v11'
        minSdk 26
        targetSdk 35
        versionCode 11
        versionName '1.1'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
