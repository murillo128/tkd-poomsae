plugins {
    id 'com.android.application'
}

android {
    namespace 'dev.murillo.highspeedprobe'
    compileSdk 35

    defaultConfig {
        applicationId 'dev.murillo.highspeedprobe'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '0.1'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
