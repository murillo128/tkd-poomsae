plugins {
    id 'com.android.application'
}

android {
    namespace 'dev.murillo.highspeedprobe'
    compileSdk 35

    defaultConfig {
        applicationId 'dev.murillo.highspeedprobe.v2'
        minSdk 23
        targetSdk 35
        versionCode 2
        versionName '0.2'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
